name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per-ref group: a PR branch's runs must never occupy main's slot. A single static
# group bit on 2026-08-13 — GitHub keeps one running + one pending run per group and
# each new arrival CANCELS the previous pending one, so while the rollover PR was
# pushing, main's CI (and its deploy) kept getting cancelled before it could start.
# The only thing that must serialize repo-wide is the Pages deploy, which has its own
# job-level `pages` group below (shared with refresh-data's deploy job).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the full suite AND writes public/coverage.json for the README badge.
      # Replaces a separate `npm test` step so the suite isn't run twice.
      - run: npm run coverage:badge
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deploys only from main, and only after tests pass — a red build never ships.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize Pages deploys across workflows (CI + refresh-data), never mid-cancel.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Netlify deploys via its own GitHub integration (it builds the-nfl-schedule.netlify.app
  # on every push using netlify.toml), so there is no Netlify job here — a CI-driven
  # deploy would be a redundant second path to the same site.

  # The data scripts use Node built-ins only, so they run on a bare checkout with no
  # install step. This job guards that property — if someone adds an npm import to a
  # script, the nightly refresh would break silently at 6am instead of here.
  scripts-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Scripts must not import from node_modules
        run: |
          if grep -rnE "^\s*import .* from ['\"][^.n]" scripts/ | grep -v "node:"; then
            echo "::error::scripts/ may only import Node built-ins (node:*) or relative paths"
            exit 1
          fi
          echo "OK — scripts/ depends only on Node built-ins"
